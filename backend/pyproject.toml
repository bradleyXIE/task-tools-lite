[project]
name = "task-tools-lite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "asyncpg",
  "pydantic>=2",
  "jsonschema",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Tests run against an isolated database, never the development one.
# TEST_DATABASE_URL (optional): URL of a database whose name ends with "_test".
#   Default: DATABASE_URL with "_test" appended to the database name (tasktools -> tasktools_test).
#   tests/conftest.py creates it if missing and aborts the session if the name does not end with "_test".

[tool.ruff]
line-length = 120
